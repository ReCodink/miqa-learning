services:
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: jawaracbtbedummy_app
    working_dir: /var/www
    volumes:
      - ../src:/var/www
    depends_on:
      - mysql
    expose:
      - "9000"
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_DATABASE=jawaracbtbedummy_db
      - DB_USERNAME=jawaracbtbedummy_user
      - DB_PASSWORD=secret
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: jawaracbtbedummy_mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: jawaracbtbedummy_db
      MYSQL_USER: jawaracbtbedummy_user
      MYSQL_PASSWORD: secret
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql.conf:/etc/mysql/conf.d/custom.cnf
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: jawaracbtbedummy_nginx
    ports:
      - "8003:80"
    volumes:
      - ../src:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped

  node:
    image: node:20-alpine
    container_name: jawaracbtbedummy_node
    working_dir: /var/www
    volumes:
      - ../src:/var/www
    ports:
      - "5175:5175"
    tty: true
    environment:
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - VITE_PORT=5175
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped

volumes:
  mysql_data: